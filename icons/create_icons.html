<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<canvas id="canvas128" width="128" height="128"></canvas>
<canvas id="canvas48" width="48" height="48"></canvas>
<canvas id="canvas16" width="16" height="16"></canvas>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const size = canvas.width;
  const scale = size / 128;
  
  // Background gradient
  const gradient = ctx.createLinearGradient(0, 0, size, size);
  gradient.addColorStop(0, '#667eea');
  gradient.addColorStop(1, '#4A90E2');
  
  // Rounded rectangle
  const radius = 24 * scale;
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, radius);
  ctx.fill();
  
  // White icon
  ctx.strokeStyle = 'white';
  ctx.lineWidth = 4 * scale;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.fillStyle = 'none';
  
  // Top layer
  ctx.beginPath();
  ctx.moveTo(32*scale, 48*scale);
  ctx.lineTo(64*scale, 32*scale);
  ctx.lineTo(96*scale, 48*scale);
  ctx.lineTo(64*scale, 64*scale);
  ctx.closePath();
  ctx.stroke();
  
  // Middle layer
  ctx.beginPath();
  ctx.moveTo(32*scale, 64*scale);
  ctx.lineTo(64*scale, 80*scale);
  ctx.lineTo(96*scale, 64*scale);
  ctx.stroke();
  
  // Bottom layer
  ctx.beginPath();
  ctx.moveTo(32*scale, 80*scale);
  ctx.lineTo(64*scale, 96*scale);
  ctx.lineTo(96*scale, 80*scale);
  ctx.stroke();
  
  // Gold circle
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(90*scale, 42*scale, 8*scale, 0, Math.PI * 2);
  ctx.fill();
}

['128', '48', '16'].forEach(size => {
  const canvas = document.getElementById('canvas' + size);
  drawIcon(canvas);
  const link = document.createElement('a');
  link.download = 'icon' + size + '.png';
  link.href = canvas.toDataURL();
  link.click();
});
</script>
</body>
</html>
