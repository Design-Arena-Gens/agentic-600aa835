<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MailMind AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-content">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#4A90E2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 17L12 22L22 17" stroke="#4A90E2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="#4A90E2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1>MailMind AI</h1>
        </div>
        <button class="settings-btn" id="settingsBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="3" stroke="#666" stroke-width="2"/>
            <path d="M12 1V3M12 21V23M4.22 4.22L5.64 5.64M18.36 18.36L19.78 19.78M1 12H3M21 12H23M4.22 19.78L5.64 18.36M18.36 5.64L19.78 4.22" stroke="#666" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="ai-suggestions">
        <h2>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="display: inline-block; vertical-align: middle; margin-right: 8px;">
            <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" stroke="#4A90E2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          AI Suggestions
        </h2>
        <div id="suggestionsContainer">
          <!-- Suggestions will be dynamically inserted here -->
        </div>
      </section>

      <section class="recent-emails">
        <h2>Recent Emails with Dates</h2>
        <div id="emailsContainer">
          <!-- Emails will be dynamically inserted here -->
        </div>
      </section>

      <section class="upcoming-reminders">
        <h2>Upcoming Events</h2>
        <div id="remindersContainer">
          <!-- Reminders will be dynamically inserted here -->
        </div>
      </section>
    </main>

    <div class="settings-panel" id="settingsPanel">
      <div class="settings-header">
        <h2>Settings</h2>
        <button class="close-btn" id="closeSettings">×</button>
      </div>
      <div class="settings-content">
        <div class="setting-item">
          <label>
            <input type="checkbox" id="autoSync" checked>
            <span>Auto-sync with Google Calendar</span>
          </label>
        </div>
        <div class="setting-item">
          <label>
            <input type="checkbox" id="notifications" checked>
            <span>Enable notifications</span>
          </label>
        </div>
        <div class="setting-item">
          <label>
            <input type="checkbox" id="autoDetect" checked>
            <span>Auto-detect events in emails</span>
          </label>
        </div>
        <button class="save-btn" id="saveSettings">Save Settings</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
